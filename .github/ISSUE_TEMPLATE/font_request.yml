name: 🔤 Font request
description: Suggest a font to bundle with the extension
title: '[Font]: '
labels: ['font', 'enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Only fonts whose license allows redistribution (e.g. SIL Open Font License) can be bundled.
        Tip: any font installed on your computer can already be used via **Typeface → Custom**.
  - type: input
    id: name
    attributes:
      label: Font name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the font's official source
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      placeholder: SIL OFL 1.1
    validations:
      required: true
  - type: input
    id: scripts
    attributes:
      label: Languages / scripts it supports
      placeholder: Persian, Arabic
